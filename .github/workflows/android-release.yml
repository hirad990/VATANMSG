name: VATANMSG 2.1.0 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - '2.1.0'
    paths:
      - 'App.*'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - 'php-api/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: vatanmsg-2.1.0-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk-release:
    name: Build release APK with gradlew.bat
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install JavaScript dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Generate Android project with Expo
        shell: pwsh
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Install Android SDK packages and NDK
        shell: pwsh
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed with exit code $LASTEXITCODE" }

      - name: Build release APK using gradlew.bat
        shell: pwsh
        working-directory: android
        run: .\gradlew.bat --no-daemon --stacktrace assembleRelease

      - name: Verify release APK exists
        shell: pwsh
        run: |
          $apk = Get-ChildItem "android/app/build/outputs/apk/release" -Filter "*.apk" -File | Select-Object -First 1
          if (-not $apk) { throw "Gradle completed without producing a release APK." }
          Get-ChildItem "android/app/build/outputs/apk/release" -Filter "*.apk" -File | Format-Table Name, Length

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VATANMSG-2.1.0-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
