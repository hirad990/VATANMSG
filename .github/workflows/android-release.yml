name: VATANMSG Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.json'
      - 'package.json'
      - 'App.*'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Install Android NDK with retries
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Installing NDK, attempt $attempt of 3"
            yes | sdkmanager --licenses >/dev/null 2>&1
            sdkmanager --install "ndk;27.1.12297006"
            if [ $? -eq 0 ] && [ -d "$ANDROID_HOME/ndk/27.1.12297006" ]; then
              exit 0
            fi
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/temp"
            sleep 5
          done
          echo "NDK installation failed after 3 attempts."
          exit 1

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VATANMSG-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
