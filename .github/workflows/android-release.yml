name: VATANMSG 2.1.0 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - '2.1.0'
    paths:
      - '.github/workflows/android-release.yml'
      - 'App.*'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - 'php-api/**'

permissions:
  contents: read

concurrency:
  group: vatanmsg-2.1.0-windows-release-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk-release:
    name: Build signed release APK with gradlew.bat
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Install JavaScript dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Generate Android project with Expo
        shell: pwsh
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Configure release signing
        shell: pwsh
        env:
          VATAN_KEYSTORE_BASE64: ${{ secrets.VATAN_KEYSTORE_BASE64 }}
          VATAN_STORE_PASSWORD: ${{ secrets.VATAN_STORE_PASSWORD }}
          VATAN_KEY_ALIAS: ${{ secrets.VATAN_KEY_ALIAS }}
          VATAN_KEY_PASSWORD: ${{ secrets.VATAN_KEY_PASSWORD }}
        run: |
          $required = @('VATAN_KEYSTORE_BASE64','VATAN_STORE_PASSWORD','VATAN_KEY_ALIAS','VATAN_KEY_PASSWORD')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name" -ErrorAction SilentlyContinue).Value)) {
              throw "Missing GitHub Actions secret: $name. Add it in Settings > Secrets and variables > Actions."
            }
          }
          $keystorePath = Join-Path $PWD 'android/app/vatan-release.keystore'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:VATAN_KEYSTORE_BASE64))
          $gradleFile = 'android/app/build.gradle'
          $gradle = Get-Content $gradleFile -Raw

          # Inject config immediately after the signingConfigs opening brace.
          if ($gradle -notmatch 'vatan-release\.keystore') {
            $marker = 'signingConfigs {'
            if (-not $gradle.Contains($marker)) { throw 'Could not find signingConfigs opening block.' }
            $config = @"
          signingConfigs {
              release {
                  storeFile file('vatan-release.keystore')
                  storePassword System.getenv('VATAN_STORE_PASSWORD')
                  keyAlias System.getenv('VATAN_KEY_ALIAS')
                  keyPassword System.getenv('VATAN_KEY_PASSWORD')
              }
          "@
            $gradle = $gradle.Replace($marker, $config.TrimEnd())
          }

          # Change only the release buildType's signingConfig, leaving debug untouched.
          $buildTypesAt = $gradle.IndexOf('buildTypes')
          if ($buildTypesAt -lt 0) { throw 'Could not locate buildTypes.' }
          $releaseAt = $gradle.IndexOf('release {', $buildTypesAt)
          if ($releaseAt -lt 0) { throw 'Could not locate release build type.' }
          $debugSigningAt = $gradle.IndexOf('signingConfig signingConfigs.debug', $releaseAt)
          $releaseSigningAt = $gradle.IndexOf('signingConfig signingConfigs.release', $releaseAt)
          if ($debugSigningAt -ge 0 -and ($releaseSigningAt -lt 0 -or $debugSigningAt -lt $releaseSigningAt)) {
            $gradle = $gradle.Remove($debugSigningAt, 'signingConfig signingConfigs.debug'.Length).Insert($debugSigningAt, 'signingConfig signingConfigs.release')
          } elseif ($releaseSigningAt -lt 0) {
            # Insert near the start of the release block; Android's generated release block has no nested braces before its signing line.
            $insertAt = $releaseAt + 'release {'.Length
            $gradle = $gradle.Insert($insertAt, "`r`n            signingConfig signingConfigs.release")
          }
          Set-Content -Path $gradleFile -Value $gradle -NoNewline
          Write-Host 'Release signing configured.'
          
      - name: Build signed release APK using gradlew.bat
        shell: pwsh
        working-directory: android
        env:
          VATAN_STORE_PASSWORD: ${{ secrets.VATAN_STORE_PASSWORD }}
          VATAN_KEY_ALIAS: ${{ secrets.VATAN_KEY_ALIAS }}
          VATAN_KEY_PASSWORD: ${{ secrets.VATAN_KEY_PASSWORD }}
        run: .\gradlew.bat --no-daemon --stacktrace assembleRelease

      - name: Verify APK is signed with release key
        shell: pwsh
        run: |
          $apk = Get-ChildItem "android/app/build/outputs/apk/release" -Filter "*.apk" -File | Select-Object -First 1
          if (-not $apk) { throw "Gradle completed without producing a release APK." }
          $apksigner = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Filter "apksigner.bat" -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $apksigner) { throw "apksigner.bat not found." }
          & $apksigner.FullName verify --print-certs $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed." }
          Get-Item $apk.FullName | Format-Table Name, Length

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VATANMSG-2.1.0-apk-release-signed
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
